<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Learning — New Curriculum</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <header class="topbar">
        <span class="brand">
            <span class="brand-mark">A</span>
            Adaptive Learning
        </span>
    </header>

    <div class="create-shell">
        <h1>What do you want to learn?</h1>
        <p class="subtitle">
            Give it a topic and, optionally, a bit about your background or
            goals. It'll build a curriculum you can generate lessons from.
        </p>

        <div class="create-card">
            <form method="post" action="/internal/curriculum">
                <label class="field-label" for="topic">Topic</label>
                <input id="topic" name="topic" type="text" required
                    placeholder="e.g. SQL window functions">

                <label class="field-label" for="optional_context">Your background (optional)</label>
                <textarea id="optional_context" name="optional_context"
                    placeholder="What you already know, what you're trying to do with this..."></textarea>

                <button class="primary-button" type="submit" style="margin-top: 20px;">
                    Generate Curriculum
                </button>

                <details class="dev-options">
                    <summary>Developer: load a saved test scenario</summary>
                    <label class="field-label" for="scenario">Test Scenario</label>
                    <select id="scenario">
                        <option value="">Custom</option>
                        {% for scenario in scenarios %}
                        <option value="{{ loop.index0 }}" data-topic="{{ scenario.topic }}"
                            data-context="{{ scenario.optional_context }}">
                            {{ scenario.id }}
                        </option>
                        {% endfor %}
                    </select>
                </details>
            </form>
        </div>
    </div>

    <script>
        const scenarioSelect = document.getElementById("scenario");
        const topicInput = document.getElementById("topic");
        const contextInput = document.getElementById("optional_context");

        scenarioSelect.addEventListener("change", () => {
            const option = scenarioSelect.options[scenarioSelect.selectedIndex];

            if (!option.value) {
                return;
            }

            topicInput.value = option.dataset.topic;
            contextInput.value = option.dataset.context;
        });
    </script>
</body>

</html>
