[project]
name = "adaptive-learning-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bleach",
    "fastapi",
    "httpx",
    "jinja2",
    "markdown",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"